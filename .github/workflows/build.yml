# Build the Project Noble client on every push to main and on demand.
# Produces a one-click noble-client.exe (and noble-dedicated.exe) so both PCs
# always run the same binary. The ~2.2 GB of runtime engine data is NOT in git
# (it is copied from each user's own MCC install), so only the executables are
# uploaded as artifacts.

name: Build

on:
  push:
    branches: [ main ]
    # Docs/screenshot-only pushes were starting a full Windows build for every
    # handoff edit. They cannot change the executable, so skip them.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'reports/**'
  workflow_dispatch:

# A new push supersedes the previous build; don't leave a queue of stale
# 15-minute runners (and their failure mail) behind.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build noble-client (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The menu map/string tables are game data and are never committed. CI only checks that the
      # three targets compile: give the resource compiler empty placeholders (the artifact is not a
      # runnable client; contributors build locally with their own MCC data).
      - name: Provide compile-only data placeholders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data/menumaps | Out-Null
          foreach ($f in 'mainmenu_all.map','mainmenu_all.string_ids.csv','mainmenu_armory.string_ids.csv','mainmenu_armory_elite.string_ids.csv') {
            $p = "data/menumaps/$f"
            if (!(Test-Path $p)) { [System.IO.File]::WriteAllBytes($p, [byte[]]@()) }
          }

      - name: Configure (CMake + MSVC x64)
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Upload noble-client.exe
        uses: actions/upload-artifact@v4
        with:
          name: noble-client
          path: build/bin/Release/noble-client.exe

      - name: Upload noble-dev.exe
        uses: actions/upload-artifact@v4
        with:
          name: noble-dev
          path: build/bin/Release/noble-dev.exe

      - name: Upload noble-dedicated.exe
        uses: actions/upload-artifact@v4
        with:
          name: noble-dedicated
          path: build/bin/Release/noble-dedicated.exe
